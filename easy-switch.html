<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TD Easy Switch — Demo</title>
  <style>
    /* ============================================================
       TOKENS
    ============================================================ */
    :root {
      --td-green:      #00A651;
      --td-green-d:    #007A3C;
      --td-green-pale: #e8f7ef;
      --td-green-mid:  #d1f0e0;
      --fb-blue:       #1877f2;
      --fb-blue-d:     #1558b0;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --transition: .2s ease;
    }
    :root, body.light {
      --fb-bg:     #f0f2f5;
      --fb-card:   #ffffff;
      --fb-border: #dddfe2;
      --fb-text:   #1c1e21;
      --fb-muted:  #65676b;
      --fb-input:  #f0f2f5;
      --page-bg:   #e2e5e9;
      --td-bg:     #f5f5f5;
      --td-card:   #ffffff;
      --td-text:   #1a1a1a;
      --td-muted:  #555;
      --td-border: #e0e0e0;
      --td-input:  #fafafa;
    }
    body.dark {
      --fb-bg:     #18191a;
      --fb-card:   #242526;
      --fb-border: #3a3b3c;
      --fb-text:   #e4e6eb;
      --fb-muted:  #b0b3b8;
      --fb-input:  #3a3b3c;
      --page-bg:   #111827;
      --td-bg:     #0f172a;
      --td-card:   #1e293b;
      --td-text:   #f1f5f9;
      --td-muted:  #94a3b8;
      --td-border: #334155;
      --td-input:  #0f172a;
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--page-bg);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      transition: background var(--transition);
    }
    body.desktop-mode { overflow: auto; align-items: flex-start; }

    /* ============================================================
       FLOATING CONTROLS PILL
    ============================================================ */
    #floating-controls {
      position: fixed; top: 16px; right: 16px; z-index: 9999;
      background: rgba(28,28,30,.92);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 999px; padding: 7px 14px; gap: 14px;
      align-items: center; display: flex;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    body.light #floating-controls { background: rgba(255,255,255,.9); border-color: rgba(0,0,0,.12); box-shadow: 0 4px 20px rgba(0,0,0,.15); }
    .fc-sep { width: 1px; height: 18px; background: rgba(255,255,255,.18); }
    body.light .fc-sep { background: rgba(0,0,0,.12); }
    .fc-label { font-size: 11px; font-weight: 600; color: #9ca3af; user-select: none; }
    body.light .fc-label { color: #6b7280; }
    .fc-toggle { position: relative; width: 40px; height: 22px; cursor: pointer; }
    .fc-toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .fc-track { position: absolute; inset: 0; background: rgba(127,127,127,.3); border-radius: 22px; transition: background .2s; }
    .fc-knob  { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #9ca3af; border-radius: 50%; transition: transform .2s, background .2s; display: flex; align-items: center; justify-content: center; font-size: 10px; line-height: 1; }
    .fc-toggle input:checked ~ .fc-track { background: var(--td-green); }
    .fc-toggle input:checked ~ .fc-knob  { transform: translateX(18px); background: #fff; }

    /* ============================================================
       MOBILE PHONE FRAME
    ============================================================ */
    #phone-stage {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100vh;
    }
    #phone-bezel {
      position: relative; width: 390px; height: 844px;
      border-radius: 54px; background: #1c1c1e;
      box-shadow: 0 0 0 2px #3a3a3c, 0 0 0 7px #1c1c1e, 0 0 0 9px #3a3a3c,
                  0 40px 100px rgba(0,0,0,.8), inset 0 0 0 1px rgba(255,255,255,.07);
      flex-shrink: 0; display: flex; flex-direction: column; padding: 12px;
    }
    #phone-bezel::before { content:""; position:absolute; left:-11px; top:140px; width:4px; height:36px; background:#3a3a3c; border-radius:2px 0 0 2px; box-shadow:0 54px 0 #3a3a3c,0 108px 0 #3a3a3c; }
    #phone-bezel::after  { content:""; position:absolute; right:-11px; top:175px; width:4px; height:70px; background:#3a3a3c; border-radius:0 2px 2px 0; }
    #phone-screen {
      border-radius: 44px; overflow: hidden;
      flex: 1; display: flex; flex-direction: column; position: relative;
    }
    #phone-island { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:120px; height:32px; background:#000; border-radius:20px; z-index:300; pointer-events:none; display:flex; align-items:center; justify-content:center; gap:10px; }
    #phone-island .cam { width:10px; height:10px; background:#1c1c1e; border-radius:50%; border:1.5px solid #2c2c2e; }
    #phone-island .bar { width:28px; height:5px; background:#1c1c1e; border-radius:3px; }
    #phone-statusbar { height:50px; flex-shrink:0; background:var(--fb-blue); display:flex; align-items:flex-end; justify-content:space-between; padding:0 22px 8px; z-index:5; transition:background .2s; }
    #phone-statusbar.td-bar { background: #00843D; }
    #phone-statusbar .st-time { font-size:13px; font-weight:700; color:#fff; }
    #phone-statusbar .st-icons { font-size:12px; color:#fff; }
    /* The swappable view area */
    #phone-view {
      flex:1; position:relative; overflow:hidden;
      background: var(--fb-bg);
    }
    #phone-home { height:26px; background:var(--fb-card); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .2s; }
    #phone-home div { width:110px; height:4px; background:var(--fb-text); opacity:.15; border-radius:2px; }

    /* ============================================================
       DESKTOP BROWSER FRAME
    ============================================================ */
    #desktop-stage {
      display: none; width: 100%; min-height: 100vh; flex-direction: column;
    }
    .browser-chrome {
      background: #2b2b2b; padding: 10px 16px 8px;
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      position: sticky; top: 0; z-index: 200;
    }
    body.light .browser-chrome { background: #dee1e6; }
    .browser-dots { display:flex; gap:6px; }
    .browser-dot { width:12px; height:12px; border-radius:50%; }
    .browser-dot.red    { background:#ff5f57; }
    .browser-dot.yellow { background:#febc2e; }
    .browser-dot.green  { background:#28c840; }
    .browser-urlbar {
      flex:1; background:#1c1c1e; border-radius:6px;
      padding:5px 12px; font-size:13px; color:#b0b3b8;
      display:flex; align-items:center; gap:6px;
    }
    body.light .browser-urlbar { background:#fff; color:#444; border:1px solid #ccc; }
    #browser-url-text { flex:1; font-size:13px; }
    /* the two swappable views in desktop */
    #desktop-view { flex:1; }

    /* ============================================================
       SCREEN SLOTS — each "page" is a .screen div
    ============================================================ */
    .screen { display:none; width:100%; height:100%; }
    .screen.active { display:block; }
    /* Inside phone the screens need to fill + scroll */
    #phone-view .screen { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; }
    #phone-view .screen::-webkit-scrollbar { display:none; }
    /* Inside desktop the screens just flow normally */
    #desktop-view .screen { height:auto; }

    /* ============================================================
       SHARED FACEBOOK COMPONENTS
    ============================================================ */
    .fb-topnav-mobile {
      background: var(--fb-blue); height:56px; padding:0 14px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:50;
    }
    .fb-logo { font-size:30px; font-weight:900; color:#fff; letter-spacing:-1px; }
    .fb-logo-desktop { font-size:36px; font-weight:900; color:var(--fb-blue); letter-spacing:-1px; }
    .fb-nav-search-m { background:rgba(255,255,255,.2); border:none; border-radius:20px; padding:7px 12px; font-size:13px; color:#fff; width:140px; }
    .fb-nav-search-m::placeholder { color:rgba(255,255,255,.7); }
    .fb-nav-icons { display:flex; gap:8px; }
    .fb-nav-icon { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; }

    /* Stories */
    .fb-stories { display:flex; gap:8px; padding:10px 12px; background:var(--fb-card); border-bottom:1px solid var(--fb-border); overflow-x:auto; scrollbar-width:none; }
    .fb-stories::-webkit-scrollbar { display:none; }
    .fb-story { flex-shrink:0; text-align:center; cursor:pointer; }
    .fb-story-ring { width:56px; height:56px; border-radius:50%; border:3px solid var(--fb-blue); padding:2px; margin:0 auto 4px; }
    .fb-story-ring.no-ring { border-color:transparent; }
    .fb-story-img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
    .fb-story-name { font-size:11px; color:var(--fb-text); width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    /* Composer */
    .fb-composer { background:var(--fb-card); border-bottom:8px solid var(--fb-bg); padding:10px 12px; }
    .fb-composer-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .fb-composer-avatar { width:38px; height:38px; border-radius:50%; overflow:hidden; flex-shrink:0; }
    .fb-composer-avatar img { width:100%; height:100%; object-fit:cover; }
    .fb-composer-box { flex:1; background:var(--fb-input); border:none; border-radius:20px; padding:9px 14px; font-size:15px; color:var(--fb-muted); cursor:pointer; }
    .fb-composer-actions { display:flex; justify-content:space-around; border-top:1px solid var(--fb-border); padding-top:8px; }
    .fb-composer-action { font-size:13px; font-weight:600; color:var(--fb-muted); cursor:pointer; padding:4px 8px; }

    /* Posts */
    .fb-post { background:var(--fb-card); border-top:1px solid var(--fb-border); border-bottom:1px solid var(--fb-border); margin-bottom:8px; }
    .fb-post-header { display:flex; align-items:center; gap:10px; padding:10px 12px 6px; }
    .fb-post-avatar { width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0; }
    .fb-post-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .fb-post-avatar.page-icon { border-radius:10px; }
    .fb-post-author { font-size:14px; font-weight:700; color:var(--fb-text); }
    .fb-post-meta { font-size:12px; color:var(--fb-muted); }
    .fb-post-more { font-size:20px; color:var(--fb-muted); cursor:pointer; margin-left:auto; }
    .fb-post-body { padding:2px 12px 10px; font-size:14px; line-height:1.55; color:var(--fb-text); }
    .fb-post-img { width:100%; object-fit:cover; display:block; }
    .fb-post-reactions { padding:6px 12px; font-size:13px; color:var(--fb-muted); display:flex; justify-content:space-between; }
    .fb-post-actions { display:flex; border-top:1px solid var(--fb-border); }
    .fb-post-action { flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:8px; font-size:13px; font-weight:600; color:var(--fb-muted); cursor:pointer; }
    .fb-post-action:hover { background:var(--fb-input); }

    /* TD Ad in feed */
    .td-ad-hero {
      background: linear-gradient(150deg, #00A651 0%, #007A3C 55%, #004d26 100%);
      padding:28px 20px 22px; position:relative; overflow:hidden;
    }
    .td-ad-hero::before { content:''; position:absolute; top:-50px; right:-50px; width:200px; height:200px; background:rgba(255,255,255,.06); border-radius:50%; }
    .td-ad-eyebrow { display:inline-block; background:rgba(255,255,255,.2); color:#fff; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:4px 10px; border-radius:20px; margin-bottom:12px; position:relative; z-index:1; }
    .td-ad-headline { color:#fff; font-size:20px; font-weight:800; line-height:1.25; margin-bottom:8px; position:relative; z-index:1; }
    .td-ad-subhead { color:rgba(255,255,255,.85); font-size:13px; line-height:1.55; margin-bottom:18px; position:relative; z-index:1; }
    .td-ad-steps { display:flex; gap:8px; position:relative; z-index:1; }
    .td-ad-step { flex:1; background:rgba(255,255,255,.15); border-radius:10px; padding:10px 6px; text-align:center; }
    .td-ad-step-icon { font-size:20px; margin-bottom:4px; }
    .td-ad-step-label { font-size:10px; color:rgba(255,255,255,.9); font-weight:600; line-height:1.3; }
    .td-ad-cta-strip { background:var(--fb-card); border-top:1px solid var(--fb-border); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; }
    .td-ad-cta-url { font-size:11px; color:var(--fb-muted); text-transform:uppercase; letter-spacing:.5px; }
    .td-ad-cta-title { font-size:14px; font-weight:700; color:var(--fb-text); }
    .td-ad-cta-desc { font-size:12px; color:var(--fb-muted); }
    .td-ad-cta-btn { background:var(--fb-blue); color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap; margin-left:10px; transition:background .1s; }
    .td-ad-cta-btn:hover { background:var(--fb-blue-d); }

    /* Desktop nav */
    .desktop-topnav { background:var(--fb-card); border-bottom:1px solid var(--fb-border); height:56px; padding:0 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; box-shadow:0 1px 4px rgba(0,0,0,.08); }
    .desktop-nav-search { background:var(--fb-input); border:none; border-radius:20px; padding:8px 16px; font-size:15px; color:var(--fb-text); width:220px; }
    .desktop-nav-center { display:flex; gap:4px; }
    .desktop-nav-tab { padding:0 26px; height:48px; display:flex; align-items:center; border-radius:8px; cursor:pointer; font-size:22px; color:var(--fb-muted); border-bottom:3px solid transparent; }
    .desktop-nav-tab.active { color:var(--fb-blue); border-bottom-color:var(--fb-blue); }
    .desktop-nav-right { display:flex; gap:8px; align-items:center; }
    .desktop-nav-btn { width:40px; height:40px; border-radius:50%; background:var(--fb-input); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; }

    /* Desktop 3-col */
    .desktop-layout { display:flex; justify-content:center; gap:24px; padding:16px; max-width:1240px; margin:0 auto; }
    .desktop-left { width:270px; flex-shrink:0; padding-top:4px; }
    .desktop-feed-col { width:580px; flex-shrink:0; }
    .desktop-right { width:300px; flex-shrink:0; padding-top:4px; }
    .sidebar-item { display:flex; align-items:center; gap:12px; padding:8px; border-radius:8px; cursor:pointer; font-size:15px; font-weight:500; color:var(--fb-text); }
    .sidebar-item:hover { background:var(--fb-input); }
    .sidebar-item.active { background:#e7f3ff; color:var(--fb-blue); }
    body.dark .sidebar-item.active { background:#263951; }
    .sidebar-icon { width:36px; height:36px; border-radius:50%; overflow:hidden; flex-shrink:0; background:var(--fb-input); display:flex; align-items:center; justify-content:center; font-size:18px; }
    .sidebar-divider { height:1px; background:var(--fb-border); margin:8px 0; }
    .sidebar-title { font-size:17px; font-weight:700; padding:6px 8px; color:var(--fb-text); }
    .right-section { margin-bottom:20px; }
    .right-title { font-size:16px; font-weight:700; margin-bottom:10px; color:var(--fb-text); }
    .right-ad { background:var(--fb-card); border-radius:10px; border:1px solid var(--fb-border); padding:12px; margin-bottom:8px; cursor:pointer; }
    .right-ad-img { width:100%; height:110px; border-radius:8px; object-fit:cover; margin-bottom:8px; display:block; }
    .right-ad-name { font-size:13px; font-weight:700; color:var(--fb-text); }
    .right-ad-url { font-size:12px; color:var(--fb-muted); }
    .contact-item { display:flex; align-items:center; gap:10px; padding:6px 0; cursor:pointer; }
    .contact-avatar { width:36px; height:36px; border-radius:50%; overflow:hidden; position:relative; flex-shrink:0; }
    .contact-avatar img { width:100%; height:100%; object-fit:cover; }
    .online-dot { position:absolute; bottom:0; right:0; width:11px; height:11px; background:#31a24c; border-radius:50%; border:2px solid var(--fb-card); }
    .contact-name { font-size:15px; font-weight:500; color:var(--fb-text); }
    /* desktop post images taller */
    #screen-fb-desktop .fb-post-img { height:320px; }
    #screen-fb-desktop .td-ad-hero { padding:36px 40px; }
    #screen-fb-desktop .td-ad-headline { font-size:24px; }
    #screen-fb-desktop .td-ad-subhead { font-size:15px; }
    #screen-fb-desktop .td-ad-steps { gap:12px; }
    #screen-fb-desktop .td-ad-step { padding:14px 10px; }
    #screen-fb-desktop .td-ad-step-icon { font-size:26px; }
    #screen-fb-desktop .td-ad-step-label { font-size:12px; }
    #screen-fb-desktop .fb-post-reactions,
    #screen-fb-desktop .fb-post-body { padding-left:16px; padding-right:16px; }

    /* ============================================================
       TD EASY SWITCH LANDING PAGE  (shared mobile + desktop)
    ============================================================ */
    /* Header */
    .td-header {
      background: #fff; border-bottom: 3px solid #00843D;
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      position: sticky; top: 0; z-index: 50;
    }
    body.dark .td-header { background: #1e293b; border-color: var(--td-green); }
    .td-header-logo { display:flex; align-items:center; gap:10px; }
    .td-logo-box { width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
    .td-header-brand { font-size:17px; font-weight:700; color:var(--td-text); }
    .td-header-brand span { color:var(--td-green); }
    .td-header-nav { display:flex; gap:20px; font-size:14px; }
    .td-header-nav a { text-decoration:none; color:var(--td-muted); }
    .td-header-nav a:hover { color:var(--td-green); }
    .td-header-phone { font-size:14px; font-weight:600; color:var(--td-green); }
    /* Back button strip */
    .td-back-bar {
      background: var(--td-bg); border-bottom: 1px solid var(--td-border);
      padding: 10px 20px; display:flex; align-items:center; gap:8px;
    }
    .td-back-btn { background:none; border:none; color:var(--td-green); font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:5px; padding:4px 0; }
    .td-back-btn:hover { text-decoration:underline; }
    /* Hero banner */
    .td-landing-hero {
      background: linear-gradient(135deg, #00A651 0%, #007A3C 60%, #004d26 100%);
      padding: 40px 24px 36px; text-align:center; position:relative; overflow:hidden;
    }
    .td-landing-hero::before { content:''; position:absolute; top:-60px; right:-60px; width:260px; height:260px; background:rgba(255,255,255,.06); border-radius:50%; }
    .td-landing-hero::after  { content:''; position:absolute; bottom:-80px; left:-40px; width:220px; height:220px; background:rgba(255,255,255,.04); border-radius:50%; }
    .td-hero-eyebrow { display:inline-block; background:rgba(255,255,255,.2); color:#fff; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:5px 14px; border-radius:20px; margin-bottom:14px; position:relative; z-index:1; }
    .td-hero-headline { color:#fff; font-size:26px; font-weight:900; line-height:1.2; margin-bottom:10px; position:relative; z-index:1; }
    .td-hero-sub { color:rgba(255,255,255,.88); font-size:15px; line-height:1.6; max-width:500px; margin:0 auto 20px; position:relative; z-index:1; }
    .td-hero-steps { display:flex; gap:10px; justify-content:center; max-width:480px; margin:0 auto; position:relative; z-index:1; flex-wrap:wrap; }
    .td-hero-step { background:rgba(255,255,255,.15); border-radius:12px; padding:12px 14px; text-align:center; min-width:90px; flex:1; }
    .td-hero-step-icon { font-size:22px; margin-bottom:5px; }
    .td-hero-step-label { font-size:11px; color:rgba(255,255,255,.92); font-weight:600; line-height:1.4; }

    /* Upload zone area */
    .td-upload-section {
      max-width: 680px; margin: 32px auto; padding: 0 20px 40px;
    }
    .td-section-title { font-size:18px; font-weight:800; color:var(--td-text); margin-bottom:6px; }
    .td-section-sub { font-size:14px; color:var(--td-muted); margin-bottom:24px; line-height:1.6; }

    /* Info fields (name + contact) */
    .td-fields { display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .td-field { flex:1; min-width:140px; display:flex; flex-direction:column; gap:5px; }
    .td-field label { font-size:12px; font-weight:700; color:var(--td-muted); text-transform:uppercase; letter-spacing:.5px; }
    .td-field input {
      padding:11px 13px; border:1.5px solid var(--td-border);
      border-radius:10px; font-size:15px; font-family:var(--font);
      background:var(--td-input); color:var(--td-text);
      transition:border-color .15s;
    }
    .td-field input:focus { outline:none; border-color:var(--td-green); }
    .pref-row { display:flex; gap:8px; margin-bottom:20px; }
    .pref-btn {
      flex:1; padding:11px; border-radius:10px;
      border:1.5px solid var(--td-border); background:var(--td-card);
      font-size:14px; font-weight:600; cursor:pointer; color:var(--td-text); transition:all .15s;
    }

  /* ──────────────────────────────────────────────────────
     INIT FEEDS
  ────────────────────────────────────────────────────── */

  /* ──────────────────────────────────────────────────────
     NAVIGATION
  ────────────────────────────────────────────────────── */

  // Desktop: open TD landing in a new tab. Mobile: navigate inside phone frame.
  function clickAd(view) {
    if (view === 'desktop') {
      window.open('td-landing.html', '_blank');
    } else {
      navTo('mobile', 'td');
    }
  }

  function navTo(view, dest) {
    if (view === 'mobile') {
      const fb  = document.getElementById('screen-fb-mobile');
      const td  = document.getElementById('screen-td-mobile');
      const bar = document.getElementById('phone-statusbar');
      if (dest === 'td') {
        fb.classList.remove('active');
        td.classList.add('active');
        bar.classList.add('td-bar');
        document.getElementById('td-mobile-content').innerHTML = tdUploadScreen('mobile');
        wireDropZone('mobile');
        // Apply current version state to the freshly rendered screen
        const sv = vState['mobile'];
        const sb = document.getElementById('sub-mobile');
        if (sb) sb.textContent = sv.ver === 1 ? '🔍 Scan My Policy & Get a Quote' : '📤 Submit My Document';
        const ct = document.getElementById('calltime-mobile');
        if (ct) ct.style.display = sv.ver === 2 ? 'block' : 'none';
        // Scroll the screen div to top AFTER it is visible
        requestAnimationFrame(() => { td.scrollTop = 0; });
      } else {
        td.classList.remove('active');
        fb.classList.add('active');
        bar.classList.remove('td-bar');
      }
    } else {
      const fb      = document.getElementById('screen-fb-desktop');
      const td      = document.getElementById('screen-td-desktop');
      const urlText = document.getElementById('browser-url-text');
      if (dest === 'td') {
        fb.classList.remove('active');
        td.classList.add('active');
        urlText.textContent = 'tdinsurance.com/easy-switch';
        document.getElementById('td-desktop-content').innerHTML = tdUploadScreen('desktop');
        wireDropZone('desktop');
        // Apply current version state to the freshly rendered screen
        const dv = vState['desktop'];
        const db = document.getElementById('sub-desktop');
        if (db) db.textContent = dv.ver === 1 ? '🔍 Scan My Policy & Get a Quote' : '📤 Submit My Document';
        const dc = document.getElementById('calltime-desktop');
        if (dc) dc.style.display = dv.ver === 2 ? 'block' : 'none';
        window.scrollTo({ top: 0, behavior: 'instant' });
        document.getElementById('desktop-stage').scrollTop = 0;
      } else {
        td.classList.remove('active');
        fb.classList.add('active');
        urlText.textContent = 'facebook.com';
        window.scrollTo({ top: 0, behavior: 'instant' });
      }
    }
  }

  /* ──────────────────────────────────────────────────────
     UPLOAD LOGIC
  ────────────────────────────────────────────────────── */
  function wireDropZone(vid) {
    const dz = document.getElementById('dz-' + vid);
    if (!dz) return;
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) handleFile(vid, e.dataTransfer.files[0]);
    });
  }
  function handleFile(vid, file) {
    if (!file) return;
    const icons = {'application/pdf':'📋','image/jpeg':'🖼️','image/png':'🖼️','image/heic':'🖼️'};
    document.getElementById('fp-icon-'+vid).textContent = icons[file.type] || '📄';
    document.getElementById('fp-name-'+vid).textContent = file.name;
    document.getElementById('fp-size-'+vid).textContent = (file.size/1024/1024).toFixed(1)+' MB · Ready to scan';
    document.getElementById('fp-'+vid).classList.add('show');
    document.getElementById('sub-'+vid).disabled = false;
  }
  function removeFile(vid) {
    document.getElementById('fp-'+vid).classList.remove('show');
    document.getElementById('sub-'+vid).disabled = true;
    const fi = document.getElementById('fi-'+vid);
    if (fi) fi.value = '';
  }
  function setPref(vid, p) {
    document.getElementById('pref-sms-'+vid).classList.toggle('active', p==='sms');
    document.getElementById('pref-email-'+vid).classList.toggle('active', p==='email');
    const inp = document.getElementById('td-contact-'+vid);
    if (p==='sms') { inp.type='tel'; inp.placeholder='Mobile number'; }
    else { inp.type='email'; inp.placeholder='Email address'; }
  }
  function submitForm(vid) {
    const fname = (document.getElementById('td-fname-'+vid).value.trim()) || 'John';
    const lname = (document.getElementById('td-lname-'+vid).value.trim()) || 'Smith';
    const btn = document.getElementById('sub-'+vid);
    const ver = (vState[vid] || {}).ver || 1;

    if (ver === 2) {
      btn.textContent = '⏳ Uploading...'; btn.disabled = true;
      setTimeout(() => showSent(vid), 1200);
    } else {
      btn.textContent = '⏳ Scanning document...'; btn.disabled = true;
      setTimeout(() => {
        const container = vid === 'mobile'
          ? document.getElementById('td-mobile-content')
          : document.getElementById('td-desktop-content');
        container.innerHTML = tdConfirmScreen(vid, fname, lname);
        requestAnimationFrame(() => {
          if (vid === 'mobile') document.getElementById('screen-td-mobile').scrollTop = 0;
          else { window.scrollTo({ top: 0, behavior: 'instant' }); }
        });
      }, 2200);
    }
  }
  function showSent(vid) {
    const container = vid === 'mobile'
      ? document.getElementById('td-mobile-content')
      : document.getElementById('td-desktop-content');
    container.innerHTML = tdSentScreen(vid);
    requestAnimationFrame(() => {
      if (vid === 'mobile') document.getElementById('screen-td-mobile').scrollTop = 0;
      else { window.scrollTo({ top: 0, behavior: 'instant' }); }
    });
  }

  /* ─── VERSION / TIME HELPERS ─────────────────────────── */
  function setVer(vid, v) {
    vState[vid].ver = v;
    const b1 = document.getElementById('vbtn1-'+vid);
    const b2 = document.getElementById('vbtn2-'+vid);
    if (b1) { b1.style.background = v===1?'#fff':'transparent'; b1.style.color = v===1?'#00A651':'#6b7280'; b1.style.boxShadow = v===1?'0 1px 5px rgba(0,0,0,.12)':'none'; }
    if (b2) { b2.style.background = v===2?'#fff':'transparent'; b2.style.color = v===2?'#6366f1':'#6b7280'; b2.style.boxShadow = v===2?'0 1px 5px rgba(0,0,0,.12)':'none'; }
    const desc = document.getElementById('ver-desc-'+vid);
    if (desc) desc.textContent = v===1 ? 'V1 · Wait & Review — scan results shown immediately' : 'V2 · Drop & Go — submit and we\'ll call you at your preferred time';
    const ct = document.getElementById('calltime-'+vid);
    if (ct) ct.style.display = v===2 ? 'block' : 'none';
    const btn = document.getElementById('sub-'+vid);
    if (btn && !btn.disabled) btn.textContent = v===1 ? '🔍 Scan My Policy & Get a Quote' : '📤 Submit My Document';
  }

  // Global toggle from the floating pill — applies to whichever view is active
  function setGlobalVer(v) {
    // Update pill button styles
    const b1 = document.getElementById('fc-vbtn1');
    const b2 = document.getElementById('fc-vbtn2');
    if (b1) { b1.style.background = v===1?'#fff':'transparent'; b1.style.color = v===1?'#00A651':'#9ca3af'; b1.style.boxShadow = v===1?'0 1px 4px rgba(0,0,0,.2)':'none'; }
    if (b2) { b2.style.background = v===2?'#fff':'transparent'; b2.style.color = v===2?'#6366f1':'#9ca3af'; b2.style.boxShadow = v===2?'0 1px 4px rgba(0,0,0,.2)':'none'; }
    const lbl = document.getElementById('fc-ver-label');
    if (lbl) lbl.textContent = 'V'+v;
    // Apply to both views so toggling view after setting version stays consistent
    ['mobile','desktop'].forEach(vid => {
      vState[vid].ver = v;
      const btn = document.getElementById('sub-'+vid);
      if (btn && !btn.disabled) btn.textContent = v===1 ? '🔍 Scan My Policy & Get a Quote' : '📤 Submit My Document';
    });
  }

  function setTime(vid, t) {
    vState[vid].time = t;
    ['morning','afternoon','evening'].forEach(x => {
      const el = document.getElementById('time-'+x+'-'+vid);
      if (!el) return;
      const active = x === t;
      el.style.borderColor = active ? '#6366f1' : '#d1d5db';
      el.style.background  = active ? '#ede9fe' : '#fff';
      el.style.color       = active ? '#5b21b6' : '#1a1a1a';
    });
  }

  /* ──────────────────────────────────────────────────────
     VIEW / THEME TOGGLES
  ────────────────────────────────────────────────────── */
  function toggleView(isDesktop) {
    document.getElementById('fc-view-label').textContent = isDesktop ? 'Desktop' : 'Mobile';
    if (isDesktop) {
      document.getElementById('phone-stage').style.display   = 'none';
      document.getElementById('desktop-stage').style.display = 'flex';
      document.body.classList.add('desktop-mode');
      document.body.style.overflow = 'auto';
    } else {
      document.getElementById('phone-stage').style.display   = 'flex';
      document.getElementById('desktop-stage').style.display = 'none';
      document.body.classList.remove('desktop-mode');
      document.body.style.overflow = 'hidden';
    }
  }
  function toggleTheme(isDark) {
    document.getElementById('fc-theme-label').textContent = isDark ? 'Dark' : 'Light';
    document.body.classList.toggle('dark', isDark);
    document.body.classList.toggle('light', !isDark);
  }

  /* ──────────────────────────────────────────────────────
     CLOCK
  ────────────────────────────────────────────────────── */
  function tick() {
    const n = new Date();
    const t = n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
    const el = document.getElementById('clock-m');
    if (el) el.textContent = t;
  }
  setInterval(tick, 10000); tick();

  /* ──────────────────────────────────────────────────────
     BOOT
  ────────────────────────────────────────────────────── */
  document.getElementById('screen-fb-mobile').innerHTML = buildMobileFeed();
  buildDesktopFeed();

  </script>
